# =========================================================================
# COEFFICIENTS DE CALCUL DU BILAN MATIERE
# =========================================================================
# Ces coefficients etaient codes en dur dans les formules Excel d'origine.
# Ici ils sont visibles, documentes, et modifiables sans toucher au code.
# =========================================================================

# Correction appliquee au doseur four (312 DO12), suppose sur-lire de 10%.
# NON JUSTIFIE PAR UN ETALONNAGE REEL - c'est le coefficient le plus fragile
# du bilan. Le residu T3 lui est tres sensible (voir diagnostics.py).
correction_doseur_four: 0.90

# Correction sur les kWh des ajouts dans le calcul du SEEC.
correction_kwh_ajouts: 0.85

# Capacite du silo d'homogeneisation, en tonnes.
# Remplace le coefficient "x12" code en dur (12 = 1200t / 100%).
# A VERIFIER aupres du service process - si la vraie capacite est differente,
# tout l'historique de Delta_Silo_homo est faux dans la meme proportion.
capacite_silo_tonnes: 1200

# Seuils de detection d'etat (repris des formules originales)
seuil_debit_marche_alim_tph: 10      # Marche alim = debit > ce seuil
seuil_puissance_marche_alim_kw: 5    # ET puissance moteur > ce seuil
seuil_puissance_marche_bc_kw: 8      # Marche BC = puissance moteur > ce seuil

# Seuil de detection "capteur de niveau silo fige"
# Si l'ecart-type du niveau sur la journee est sous ce seuil (en points de %),
# le capteur est considere fige et Delta_Silo_homo est marque INDETERMINE
# plutot que d'etre calcule comme s'il valait 0 par defaut.
seuil_ecart_type_capteur_fige_pct: 0.3

# Deuxieme critere de fiabilite : si plus de ce % des minutes ont une valeur
# identique a la precedente, le capteur est juge majoritairement fige meme
# si son ecart-type global depasse le seuil ci-dessus (cas d'une courte
# fenetre de mouvement noyee dans une longue periode plate).
seuil_pct_minutes_figees_max: 70.0

# Plafonds physiquement plausibles pour detecter des valeurs aberrantes
# (bruit capteur, erreur de saisie, unite incoherente...).
# A ajuster selon la capacite nominale reelle des equipements.
plafond_debit_th20_tph: 250
plafond_debit_do12_tph: 250
